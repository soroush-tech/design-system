comment:
  layout: 'header, diff, flags, files,  components'
  behavior: default # Add a comment on every PR with updated coverage
  require_changes: false # Always show comment, even if no coverage change

# patch only scores changed lines, so a PR that touches only one package contributes no
# patch lines for the other flags (and carryforward covers any flag that didn't upload) -
# listing every flag keeps each package's patch gated without penalising untouched ones.
# project is intentionally left at its default (target: auto): component_management already
# owns per-component project statuses.
coverage:
  status:
    patch:
      default:
        flags:
          # gen:codecov-patch-flags start - regenerated by `pnpm gen:publish-options`; do not edit by hand
          - design-system
          - docs-content
          - eslint-config
          - hooks
          - lab
          - markdown
          - mcp
          - story-demo
          - styled-system
          - ui-spec
          # gen:codecov-patch-flags end
          # App flags are hand-managed; the docs app is not a package.
          - docs

# Carry the last known report forward so a flag that didn't upload on a commit keeps
# its coverage instead of dropping to "No report uploaded". paths map each flag to the
# files it covers.
flag_management:
  default_rules:
    carryforward: true
  individual_flags:
    # gen:codecov-flags start - regenerated by `pnpm gen:publish-options`; do not edit by hand
    - name: design-system
      paths:
        - packages/design-system/
    - name: docs-content
      paths:
        - packages/docs-content/
    - name: eslint-config
      paths:
        - packages/eslint-config/
    - name: hooks
      paths:
        - packages/hooks/
    - name: lab
      paths:
        - packages/lab/
    - name: markdown
      paths:
        - packages/markdown/
    - name: mcp
      paths:
        - packages/mcp/
    - name: story-demo
      paths:
        - packages/story-demo/
    - name: styled-system
      paths:
        - packages/styled-system/
    - name: ui-spec
      paths:
        - packages/ui-spec/
    # gen:codecov-flags end
    # The docs app flag (hand-managed - apps are not package-generated).
    - name: docs
      paths:
        - apps/docs/

component_management:
  default_rules:
    statuses:
      - type: project
        target: auto
        branches:
          - '!main'
  individual_components:
    # gen:codecov-components start - regenerated by `pnpm gen:publish-options`; do not edit by hand
    - component_id: design-system
      name: design-system
      paths:
        - packages/design-system/**
    - component_id: docs-content
      name: docs-content
      paths:
        - packages/docs-content/**
    - component_id: eslint-config
      name: eslint-config
      paths:
        - packages/eslint-config/**
    - component_id: hooks
      name: hooks
      paths:
        - packages/hooks/**
    - component_id: lab
      name: lab
      paths:
        - packages/lab/**
    - component_id: markdown
      name: markdown
      paths:
        - packages/markdown/**
    - component_id: mcp
      name: mcp
      paths:
        - packages/mcp/**
    - component_id: story-demo
      name: story-demo
      paths:
        - packages/story-demo/**
    - component_id: styled-system
      name: styled-system
      paths:
        - packages/styled-system/**
    - component_id: ui-spec
      name: ui-spec
      paths:
        - packages/ui-spec/**
    # gen:codecov-components end
    - component_id: docs
      name: docs
      paths:
        - apps/docs/**
