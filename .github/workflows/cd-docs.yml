# ci:validates nothing
# CI never runs this workflow, so no job here could prove anything about it.
name: CD · Docs

# Deploys docs.soroush.tech from the composed docs-dist branch: the live site rebuilds
# on every CI-passed main push; a package publish freezes that package's section under
# /<pkg>/<version>/, built once from the release's git tag and stored forever. Manual
# dispatch backfills or repairs a single snapshot. A tag from before the docs app (the
# releases cut in soroush-tech/core) is built by scripts/legacy-docs-snapshot.sh.

on:
  workflow_run:
    workflows: ['CI', 'CD · Packages (npm)']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      package:
        description: Package section to snapshot (from its latest release tag)
        required: true
        type: choice
        options:
          - design-system
          - markdown
          - styled-system
          - mcp
          - ui-spec
      version:
        description: Stable version to snapshot, e.g. 1.3.3 (empty = the latest release)
        required: false
        type: string

concurrency:
  group: cd-docs
  cancel-in-progress: false

jobs:
  # Rebuild the live tree on every successful CI run on main.
  live:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.name == 'CI' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: cd-docs
    timeout-minutes: 30
    permissions:
      contents: write # commits to the docs-dist branch
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Read Node.js version from .nvmrc
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build the live site
        run: pnpm --filter @soroush.tech/docs build

      - name: Checkout docs-dist (create the orphan branch on first run)
        run: |
          git fetch origin docs-dist && git worktree add -B docs-dist docs-dist origin/docs-dist || {
            git worktree add --orphan -b docs-dist docs-dist
          }

      - name: Compose the live tree
        run: node scripts/compose-docs-dist.mjs live apps/docs/build/client docs-dist

      - name: Commit docs-dist
        run: |
          cd docs-dist
          git add -A
          if git diff --cached --quiet; then
            echo "No live-tree changes."
          else
            git -c user.name=github-actions -c user.email=github-actions@github.com \
              commit -m "live: ${{ github.event.workflow_run.head_sha }}"
            git push origin docs-dist
          fi

      # No deploy step: GitHub Pages serves the docs-dist branch, so the push above is
      # the publish. Pages runs its own build-and-deploy on every push to that branch.
      #
      # This requires Settings > Pages > Source = "Deploy from a branch", branch
      # `docs-dist`, folder `/`. Set to "GitHub Actions" instead, Pages waits for a
      # deployment this workflow never makes and the site silently serves stale content.
      #
      # The custom domain is bound by the `CNAME` file that compose-docs-dist.mjs writes
      # into the tree, not by the Pages setting alone: a deploy landing without it
      # unbinds docs.soroush.tech and GitHub starts serving "Site not found".

  # Freeze the published packages' sections after a release (or on manual dispatch).
  # One leg per public package; serialized so docs-dist pushes never race.
  snapshot:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.name == 'CD · Packages (npm)' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: cd-docs
    timeout-minutes: 30
    permissions:
      contents: write # commits to the docs-dist branch
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        package: [design-system, markdown, styled-system, mcp, ui-spec]
    steps:
      - name: Checkout Repository (full history for release tags)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Manual dispatch targets a single package; the matrix legs for the others no-op.
      - name: Resolve the package's latest release tag
        id: resolve
        env:
          PKG: ${{ matrix.package }}
          DISPATCH_PKG: ${{ inputs.package }}
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$DISPATCH_PKG" ] && [ "$DISPATCH_PKG" != "$PKG" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The MCP server is published under its own scope.
          SCOPE=@soroush.tech
          [ "$PKG" = mcp ] && SCOPE=@soroush.design
          # Stable releases only: an rc is never archived, and `sort -V` ranks 2.0.0-rc.1
          # above 2.0.0.
          if [ -n "$DISPATCH_VERSION" ]; then
            if ! [[ "$DISPATCH_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::$DISPATCH_VERSION is not a stable version."
              exit 1
            fi
            TAG="$SCOPE/$PKG@$DISPATCH_VERSION"
            if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              echo "::error::No release tag $TAG."
              exit 1
            fi
          else
            TAG=$(git tag --list "$SCOPE/$PKG@*" | grep -E '@[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          fi
          if [ -z "$TAG" ]; then
            echo "No release tag for $PKG."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A tag from before the docs app holds only packages/ - built on the legacy setup.
          if git cat-file -e "$TAG:apps/docs" 2>/dev/null; then legacy=false; else legacy=true; fi
          # A tag cut before the section had pages has nothing of it to freeze. The legacy setup
          # only knows the three component packages, so there it is the section's own pages that
          # decide - and a legacy tag has none for mcp or ui-spec.
          has_section=true
          if [ "$legacy" = true ]; then
            case "$PKG" in mcp | ui-spec) has_section=false ;; esac
          elif ! git cat-file -e "$TAG:apps/docs/src/pages/$PKG" 2>/dev/null; then
            has_section=false
          fi
          if [ "$has_section" = false ]; then
            echo "$TAG has no docs section for $PKG - skipped."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG##*@}" >> "$GITHUB_OUTPUT"
          echo "legacy=$legacy" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Checkout docs-dist (create the orphan branch on first run)
        if: steps.resolve.outputs.skip == 'false'
        run: |
          git fetch origin docs-dist && git worktree add -B docs-dist docs-dist origin/docs-dist || {
            git worktree add --orphan -b docs-dist docs-dist
          }

      # A publish never rebuilds an archived snapshot; a manual dispatch always does - that is the
      # repair path.
      - name: Skip when the snapshot is already archived
        if: steps.resolve.outputs.skip == 'false'
        id: archived
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "workflow_dispatch" ] && node scripts/compose-docs-dist.mjs has "${{ matrix.package }}" "${{ steps.resolve.outputs.version }}" docs-dist; then
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

      # Build the docs app as it existed at the release tag - old prose, old components,
      # old demos, all consistent. A tag older than the docs app gets the legacy setup with
      # its own packages in place (see scripts/legacy-docs-snapshot.sh).
      - name: Checkout the release tag into a worktree
        if: steps.resolve.outputs.skip == 'false' && steps.archived.outputs.done == 'false'
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          LEGACY: ${{ steps.resolve.outputs.legacy }}
        run: |
          if [ "$LEGACY" = "true" ]; then
            bash scripts/legacy-docs-snapshot.sh "$TAG" snapshot-src
          else
            git worktree add snapshot-src "$TAG"
          fi

      - name: Read Node.js version from the tag's .nvmrc
        if: steps.resolve.outputs.skip == 'false' && steps.archived.outputs.done == 'false'
        run: echo "NODE_VERSION=$(cat snapshot-src/.nvmrc)" >> "$GITHUB_ENV"

      - name: Setup pnpm
        if: steps.resolve.outputs.skip == 'false' && steps.archived.outputs.done == 'false'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        if: steps.resolve.outputs.skip == 'false' && steps.archived.outputs.done == 'false'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build the section snapshot from the tag
        if: steps.resolve.outputs.skip == 'false' && steps.archived.outputs.done == 'false'
        working-directory: snapshot-src
        env:
          DOCS_SECTION: ${{ matrix.package }}
          DOCS_BASE: /${{ matrix.package }}/${{ steps.resolve.outputs.version }}/
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter @soroush.tech/docs build

      - name: Install the snapshot into docs-dist
        if: steps.resolve.outputs.skip == 'false' && steps.archived.outputs.done == 'false'
        run: |
          if [ ! -d snapshot-src/apps/docs/build/client ]; then
            echo "No snapshot output - skipping."
            exit 0
          fi
          node scripts/compose-docs-dist.mjs snapshot \
            "${{ matrix.package }}" "${{ steps.resolve.outputs.version }}" \
            snapshot-src/apps/docs/build/client docs-dist
          cd docs-dist
          git add -A
          # A repair that rebuilt the same files has nothing to commit.
          if git diff --cached --quiet; then
            echo "Snapshot unchanged."
            exit 0
          fi
          git -c user.name=github-actions -c user.email=github-actions@github.com \
            commit -m "snapshot: ${{ matrix.package }}@${{ steps.resolve.outputs.version }}"
          git push origin docs-dist

      # As above: pushing docs-dist is the publish - GitHub Pages serves that branch.
