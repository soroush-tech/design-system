# ci:validates nothing
# CI never runs this workflow, so no job here could prove anything about it.
name: CD · MCP (Cloudflare)

# Deploys the MCP server to mcp.soroush.design. Manual only, like the npm publish:
# the content bundle is baked at build time, so a deploy is a deliberate act of
# publishing whatever main currently documents.
#
# Cloudflare has no OIDC federation for Workers deploys (npm publishing does - see
# cd-packages.yml), so this job holds the only long-lived secret in the pipeline. Keep it small:
# CLOUDFLARE_API_TOKEN is scoped to the soroush.design zone and its account alone, with
# Account > Workers Scripts > Edit, Zone > Workers Routes > Edit, Zone > DNS > Edit and
# Zone > Zone > Read; both secrets live in the `cd-mcp` environment, which can require a reviewer.

on:
  workflow_dispatch:

concurrency:
  group: cd-mcp
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: cd-mcp
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check the Cloudflare secrets are set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            [ -n "${!name}" ] || { echo "::error::$name is not set in the cd-mcp environment"; exit 1; }
          done

      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read Node.js version from .nvmrc
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Bakes the component READMEs, guides, and token contract into the Worker bundle.
      - name: Generate the content bundle
        run: pnpm --filter @soroush.design/mcp gen

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/mcp
          command: deploy

      # A deploy that answers is not a deploy that works: the landing page and a real MCP
      # initialize request must both come back. The custom domain can take a moment to start
      # answering after the first deploy, so each is retried.
      - name: Check the deployed server
        run: |
          check() {
            for attempt in 1 2 3 4 5 6; do
              "$@" && return 0
              echo "attempt $attempt failed, retrying in 10s"
              sleep 10
            done
            return 1
          }
          # The response is read whole before it is searched: grep -q would close the pipe early.
          landing=$(check curl -fsS https://mcp.soroush.design/) \
            || { echo "::error::the landing page did not answer"; exit 1; }
          grep -q "MCP server" <<<"$landing" \
            || { echo "::error::the landing page is not the MCP server's"; exit 1; }
          init=$(check curl -fsS https://mcp.soroush.design/mcp \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"cd-mcp","version":"0"}}}') \
            || { echo "::error::the MCP endpoint did not answer"; exit 1; }
          grep -q '"serverInfo"' <<<"$init" \
            || { echo "::error::the MCP endpoint did not answer initialize"; exit 1; }
