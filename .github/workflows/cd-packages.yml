# ci:validates nothing
# CI never runs this workflow, so no job here could prove anything about it.
name: CD · Packages (npm)

# Publishes non-private packages to npm via Trusted Publishing (OIDC): a single named
# package, or `all` - every non-private package whose current version isn't on the
# registry yet. Manual dispatch only - never from a push, PR merge, or CI completion. A
# release is a deliberate act with required, human-written notes; auth is a short-lived
# id-token minted per run and verified against the npm trusted publisher (no long-lived
# token).
#
# The channel decides what goes out (see the `prerelease` skill). package.json always holds
# the target version; scripts/prerelease-versions.mjs turns it into the published one:
#   alpha  - <target>-alpha.N under the `alpha` dist-tag, from any branch whose commit passed
#            CI, so a PR can be tried in real apps before it merges. No GitHub Release.
#   rc     - <target>-rc.N under `rc`, from main. A GitHub pre-release.
#   stable - <target> under `latest`, from main. A GitHub Release.
# N counts up from what npm already has; a prerelease never touches `latest`.

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish (`all` = every package with an unpublished version)
        required: true
        type: choice
        # gen:publish-options start - regenerated by `pnpm gen:publish-options`; do not edit by hand
        options:
          - all
          - design-system
          - markdown
          - mcp
          - styled-system
          - ui-spec
        # gen:publish-options end
      channel:
        description: Release channel (`alpha` from a CI-passed branch; `rc` and `stable` from main)
        required: true
        type: choice
        default: alpha
        options:
          - alpha
          - rc
          - stable

concurrency:
  group: publish-packages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: cd-packages
    timeout-minutes: 15
    permissions:
      id-token: write # OIDC token for npm Trusted Publishing (no NPM_TOKEN)
      contents: write # create the GitHub Release + tag
      checks: read # read the commit's ci-ok result for an alpha
    steps:
      # rc and stable come off main only. An alpha may come off any branch, but only a commit
      # whose CI finished green: ci-ok is the single required check of ci.yml, and a branch
      # without a PR has no CI run, so it can't publish.
      - name: Check the branch and CI
        env:
          CHANNEL: ${{ inputs.channel }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$CHANNEL" != "alpha" ]; then
            [ "$GITHUB_REF" = "refs/heads/main" ] \
              || { echo "::error::$CHANNEL publishes from main only, not $GITHUB_REF"; exit 1; }
            exit 0
          fi
          conclusion=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=ci-ok" \
            --jq '[.check_runs[] | select(.status == "completed")][0].conclusion // "none"')
          [ "$conclusion" = "success" ] \
            || { echo "::error::ci-ok on $GITHUB_SHA is '$conclusion' - an alpha needs green CI (open a PR and let it pass)"; exit 1; }

      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Resolve the dispatch input to the list of packages this run publishes: the one
      # named package, or - for `all` - every non-private directory under packages/. The
      # choice list is generated from packages/ (scripts/gen-publish-options.mjs), but a
      # named package is still validated here as defense-in-depth: only non-private
      # packages may publish, and a hand-edit or private dir must not slip through. $PKG
      # is read from env (never spliced into shell) to avoid injection. Release notes are
      # sourced from an in-repo file (packages/<pkg>/release-notes/<version>.md) - require
      # one for every resolved package here, before publish, so a release can never ship
      # without notes and npm is never touched when any are missing.
      - name: Resolve packages
        env:
          PKG: ${{ inputs.package }}
        run: |
          if [ "$PKG" = "all" ]; then
            PKGS=$(node -e '
              const { readdirSync, existsSync } = require("node:fs")
              const names = readdirSync("packages", { withFileTypes: true })
                .filter((entry) => entry.isDirectory())
                .map((entry) => entry.name)
                .filter((name) => existsSync(`packages/${name}/package.json`))
                .filter((name) => require(`./packages/${name}/package.json`).private !== true)
                .sort()
              console.log(names.join(" "))
            ')
          else
            test -f "packages/$PKG/package.json" || { echo "::error::Unknown package: $PKG"; exit 1; }
            node -e 'process.exit(require(`./packages/${process.env.PKG}/package.json`).private === true ? 1 : 0)' \
              || { echo "::error::$PKG is private - not publishable"; exit 1; }
            PKGS="$PKG"
          fi
          for pkg in $PKGS; do
            VERSION=$(PKG="$pkg" node -p "require('./packages/'+process.env.PKG+'/package.json').version")
            test -f "packages/$pkg/release-notes/$VERSION.md" \
              || { echo "::error::Missing release notes: packages/$pkg/release-notes/$VERSION.md"; exit 1; }
          done
          echo "PKGS=$PKGS" >> "$GITHUB_ENV"

      - name: Read Node.js version from .nvmrc
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      # --ignore-scripts, as everywhere in CI/CD: no lifecycle script runs at
      # install - the packages build with tsdown, which needs none.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Turn the package.json targets into this channel's versions (in this checkout only) and
      # order the run dependencies-first. With `all`, a target already on npm is skipped; a
      # named one fails. The release notes were checked for the target version above.
      - name: Set channel versions
        id: versions
        env:
          CHANNEL: ${{ inputs.channel }}
          PKG: ${{ inputs.package }}
        run: |
          SKIP=""
          [ "$PKG" = "all" ] && SKIP="--skip-released"
          node scripts/prerelease-versions.mjs "$CHANNEL" $SKIP $PKGS >> "$GITHUB_ENV"

      # Publish each resolved package via npm Trusted Publishing (OIDC). Auth comes from
      # the id-token minted above - there is no NPM_TOKEN, and NODE_AUTH_TOKEN must stay
      # unset (even an empty value makes pnpm use token auth instead of falling back to
      # OIDC). Skip a version already on the registry rather than fail trying to republish
      # it - with `all`, that skip is the filter: only packages whose version isn't on npm
      # yet actually publish. Bump a package version on main to release it. Each package
      # runs in a subshell so a skip exits only that iteration and cd resets; a real
      # publish failure is recorded but doesn't abort the loop, so the remaining packages
      # still publish and the step fails at the end.
      - name: Publish packages
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          # The explicit `|| exit 1` guards are load-bearing: with the subshell on the
          # left of `||`, bash ignores errexit inside it, so failures must be raised
          # by hand for the per-package failure tracking to see them.
          # npm puts an untagged version on `latest`, which every consumer installs - so a
          # prerelease always goes out under its channel's dist-tag.
          tag=latest
          [ "$CHANNEL" != "stable" ] && tag="$CHANNEL"
          failed=""
          for pkg in $PKGS; do
            (
              cd "packages/$pkg" || exit 1
              name=$(node -p "require('./package.json').name") || exit 1
              version=$(node -p "require('./package.json').version") || exit 1
              if npm view "$name@$version" version >/dev/null 2>&1; then
                echo "⏭️ \`$name@$version\` already on npm - skipped (bump the version to release)." >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              pnpm publish --no-git-checks --tag "$tag" || exit 1
              # A prerelease on `latest` would hand it to every user: stop loudly.
              latest=$(npm view "$name" dist-tags.latest 2>/dev/null)
              case "$latest" in *-*) echo "::error::$name latest is now $latest - move it back with npm dist-tag"; exit 1 ;; esac
              echo "### 📦 Published \`$name@$version\` (\`$tag\`)" >> "$GITHUB_STEP_SUMMARY"
              echo "https://www.npmjs.com/package/$name/v/$version" >> "$GITHUB_STEP_SUMMARY"
              echo "::notice title=Published::$name@$version"
            ) || { echo "::error::Publishing $pkg failed"; failed="$failed $pkg"; }
          done
          if [ -n "$failed" ]; then
            echo "::error::Publish failed for:$failed"
            exit 1
          fi

      # Create each package's GitHub Release if it doesn't already exist - gated on the
      # release's existence, not on whether npm was newly published in this run, so a
      # rerun can repair a missing release after a successful publish. Runs even when the
      # previous step failed (`!cancelled()`) so packages that did publish still get their
      # release; a version that never made it to npm is skipped rather than released.
      # Notes come from the in-repo file packages/<pkg>/release-notes/<version>.md (its
      # existence was checked in the Resolve step, before publish); --notes-file reads it
      # verbatim. $pkg comes from the resolved list (repo directory names), never spliced
      # from the dispatch input.
      - name: Create GitHub Releases
        # Only after the versions were set: a failed version step leaves package.json at the
        # target, which must never be released under this channel. A publish failure still
        # reaches here, so packages that did publish get their release.
        if: ${{ !cancelled() && inputs.channel != 'alpha' && steps.versions.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          # An rc is a GitHub pre-release and never "Latest". --target pins the tag to the
          # published commit. The notes are the target version's file (2.0.0.md for 2.0.0-rc.1).
          flags=""
          [ "$CHANNEL" = "rc" ] && flags="--prerelease --latest=false"
          for pkg in $PKGS; do
            name=$(PKG="$pkg" node -p "require('./packages/'+process.env.PKG+'/package.json').name")
            version=$(PKG="$pkg" node -p "require('./packages/'+process.env.PKG+'/package.json').version")
            tag="$name@$version"
            if ! npm view "$name@$version" version >/dev/null 2>&1; then
              echo "⏭️ \`$tag\` is not on npm - no GitHub Release created." >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "⏭️ GitHub Release \`$tag\` already exists - skipped." >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            gh release create "$tag" --title "$tag" --target "$GITHUB_SHA" $flags \
              --notes-file "packages/$pkg/release-notes/${version%%-*}.md"
            echo "### 🏷️ Released \`$tag\`" >> "$GITHUB_STEP_SUMMARY"
          done
