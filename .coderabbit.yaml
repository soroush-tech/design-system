# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
    base_branches: [main]
  path_filters:
    - '!pnpm-lock.yaml'
    - '!**/coverage/**'
  path_instructions:
    - path: 'packages/**'
      instructions: >-
        Scoped @soroush.tech/* package. Require 100% coverage, measured by the package's
        own vitest run - not by the presence of any particular file. Tests are co-located
        and named *.test.ts or *.test.tsx (.tsx for anything rendering JSX). Barrels,
        type-only modules, and __fixtures__ are covered through their consumers and need
        no test of their own. Publishable (non-private) packages must ship a LICENSE.
chat:
  auto_reply: true
