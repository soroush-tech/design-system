# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
    base_branches: [main]
  path_filters:
    - '!pnpm-lock.yaml'
    - '!**/coverage/**'
  path_instructions:
    - path: 'packages/**'
      instructions: >-
        Scoped @soroush.tech/* package. Require 100% coverage and a co-located *.test.ts
        per source file. Publishable (non-private) packages must ship a LICENSE.
chat:
  auto_reply: true
