sonar.projectKey=soroush-tech_design-system
sonar.organization=soroush-tech

# Every component's docs page is the same four-line template - heading, README intro,
# its stories as demos - so they read as duplicates of each other. The uniformity is
# the point; duplication analysis on the rest of the repo still applies.
sonar.cpd.exclusions=packages/*/src/**/*.mdx
