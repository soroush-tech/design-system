# SonarCloud analyses this repo with Automatic Analysis - there is no scanner step in
# CI - and that path reads this file. `sonar-project.properties` is only consulted by
# the CLI scanner, so analysis scope settings have to live here to take effect.

# The brand color ramps are data, not logic: one file per hue, each the same ladder of
# nine steps plus a `base` accessor, so duplication analysis reads them as copies of one
# another. That shape is the contract. Everything else in the repo is still measured.
sonar.cpd.exclusions=apps/docs/src/theme/colors/**

# The plugin's `references/` directory is generated output, not source: `pnpm gen -- --plugin`
# renders two of the files and copies the rest verbatim from the design-system package, and
# a `--check` run in pre-commit fails the commit if a byte drifts. The copies exist so the
# skill works without the repo checked out, which makes them duplicates by contract. Their
# sources are still analysed where they are authored, under packages/design-system.
sonar.exclusions=plugins/soroush-design-system/skills/soroush-design-system/references/**
